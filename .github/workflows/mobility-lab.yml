name: Open Mobility Intelligence Lab

on:
  push:
    branches: [main]
    paths: ['open-mobility-intelligence-lab/**', '.github/workflows/mobility-lab.yml']
  pull_request:
    paths: ['open-mobility-intelligence-lab/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobility-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: open-mobility-intelligence-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: open-mobility-intelligence-lab/pipeline/requirements.txt
      - name: Pipeline unit tests (SQL rules on fixtures + published-data checks)
        run: |
          pip install -r pipeline/requirements.txt
          python -m pytest pipeline/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: open-mobility-intelligence-lab/web/package-lock.json
      - name: Front-end typecheck, unit tests and build
        working-directory: open-mobility-intelligence-lab/web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: open-mobility-intelligence-lab/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
